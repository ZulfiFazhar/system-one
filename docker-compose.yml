services:
  system-one:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: system-one-api
    ports:
      - "8000:8000"
    environment:
      - LAYA_DEVICE=cpu
      - LAYA_MODEL_PATH=/app/models/laya-multilingual
    volumes:
      - ./models:/app/models
    restart: unless-stopped
