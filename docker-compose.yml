services:
  system-one:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: system-one-api
    ports:
      - "8000:8000"
    environment:
      - LAYA_DEVICE=cpu
      - LAYA_MODEL_PATH=/app/models/laya-multilingual
    volumes:
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
