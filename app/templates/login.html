<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System One | Admin Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bgDark: "#09090b",
                        cardDark: "#18181b",
                        cardSubtle: "#141417",
                        borderDark: "#27272a",
                        borderHover: "#3f3f46",
                        accentCyan: "#06b6d4",
                    },
                    boxShadow: {
                        hard: "2px 2px 0px rgba(0, 0, 0, 0.5)",
                    },
                    fontFamily: {
                        sans: ["Inter", "system-ui", "-apple-system", "sans-serif"],
                        mono: ["JetBrains Mono", "ui-monospace", "monospace"],
                    },
                },
            },
        };
    </script>
    <style>
        body {
            background-color: #09090b;
            color: #f4f4f5;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .brutal-card {
            background-color: #18181b;
            border: 1px solid #27272a;
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.5);
        }
        .brutal-btn {
            border: 1px solid #3f3f46;
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
        }
        .brutal-btn:hover:not(:disabled) {
            transform: translate(-1px, -1px);
            border-color: #71717a;
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.7);
        }
        .brutal-btn:active:not(:disabled) {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px rgba(0, 0, 0, 0.4);
        }
        .brutal-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .brutal-input {
            border: 1px solid #27272a;
            background-color: #0c0c0e;
            color: #ffffff;
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.5);
            transition: border-color 0.15s ease;
        }
        .brutal-input:focus {
            outline: none;
            border-color: #52525b;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[#09090b] text-[#f4f4f5] antialiased">
    <div class="w-full max-w-md">
        <div class="brutal-card p-6 sm:p-8">
            <!-- Header: Zulvis System One brand with colored pill & badge -->
            <div class="flex items-center justify-between pb-5 border-b border-[#27272a] mb-6">
                <div class="flex items-center gap-2.5">
                    <span class="w-3.5 h-3.5 bg-cyan-400 inline-block shadow-[2px_2px_0px_rgba(0,0,0,0.5)]"></span>
                    <span class="font-extrabold text-base tracking-tight font-sans text-white">Zulvis System One</span>
                </div>
                <span class="text-xs px-2 py-0.5 border border-[#3f3f46] font-mono bg-[#141417] text-zinc-300">
                    Admin
                </span>
            </div>

            <!-- Title & Subtitle -->
            <div class="mb-6">
                <h1 class="text-xl font-bold font-sans tracking-tight text-white">Admin Console Authentication</h1>
                <p class="text-xs text-zinc-400 font-mono mt-1.5 leading-relaxed">Enter administrative credentials to access the dashboard</p>
            </div>

            <!-- Error Banner -->
            <div id="login-error-banner" class="hidden mb-5 p-3 bg-[#2a0e14] border border-rose-800 text-rose-300 text-xs font-mono shadow-[2px_2px_0px_rgba(0,0,0,0.5)]" role="alert">
                <div class="flex items-start gap-2">
                    <span class="text-rose-400 font-bold shrink-0">[!]</span>
                    <span id="login-error-message">Invalid credentials provided.</span>
                </div>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-4" novalidate>
                <div>
                    <label for="username-input" class="block text-xs font-mono uppercase text-zinc-300 mb-1.5">
                        Username
                    </label>
                    <input
                        type="text"
                        id="username-input"
                        name="username"
                        required
                        autofocus
                        autocomplete="username"
                        placeholder="Admin username"
                        class="brutal-input w-full px-3 py-2 text-sm font-mono placeholder-zinc-600"
                    />
                </div>

                <div>
                    <label for="password-input" class="block text-xs font-mono uppercase text-zinc-300 mb-1.5">
                        Password
                    </label>
                    <input
                        type="password"
                        id="password-input"
                        name="password"
                        required
                        autocomplete="current-password"
                        placeholder="••••••••••••"
                        class="brutal-input w-full px-3 py-2 text-sm font-mono placeholder-zinc-600"
                    />
                </div>

                <div class="pt-2">
                    <button
                        type="submit"
                        id="login-submit-btn"
                        class="brutal-btn w-full py-2.5 px-4 bg-white text-black hover:bg-zinc-200 text-xs font-mono font-bold uppercase tracking-wider flex items-center justify-center gap-2"
                    >
                        <svg id="login-spinner" class="hidden w-4 h-4 animate-spin text-black" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                        </svg>
                        <span id="login-btn-text">Sign In to Console</span>
                    </button>
                </div>
            </form>

            <!-- Footer Link -->
            <div class="mt-6 pt-4 border-t border-[#27272a] text-center">
                <a href="/" class="text-xs font-mono text-zinc-400 hover:text-white transition inline-flex items-center gap-1">
                    <span>&larr; Back to System One</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const form = document.getElementById("login-form");
            const usernameInput = document.getElementById("username-input");
            const passwordInput = document.getElementById("password-input");
            const submitBtn = document.getElementById("login-submit-btn");
            const spinner = document.getElementById("login-spinner");
            const btnText = document.getElementById("login-btn-text");
            const errorBanner = document.getElementById("login-error-banner");
            const errorMessage = document.getElementById("login-error-message");

            function showError(msg) {
                errorMessage.textContent = msg || "Authentication failed. Please verify credentials.";
                errorBanner.classList.remove("hidden");
            }

            function hideError() {
                errorBanner.classList.add("hidden");
            }

            function setLoading(loading) {
                submitBtn.disabled = loading;
                if (loading) {
                    spinner.classList.remove("hidden");
                    btnText.textContent = "Authenticating...";
                } else {
                    spinner.classList.add("hidden");
                    btnText.textContent = "Sign In to Console";
                }
            }

            form.addEventListener("submit", async function(e) {
                e.preventDefault();
                hideError();

                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                if (!username || !password) {
                    showError("Both username and password are required.");
                    return;
                }

                setLoading(true);

                try {
                    const resp = await fetch("/admin/login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            username: username,
                            password: password,
                        }),
                    });

                    if (resp.ok) {
                        const data = await resp.json();
                        window.location.href = data.redirect || "/admin";
                    } else {
                        let errorDetail = "Invalid username or password";
                        try {
                            const errData = await resp.json();
                            if (errData && errData.detail) {
                                errorDetail = errData.detail;
                            }
                        } catch (_) {}
                        showError(errorDetail);
                        setLoading(false);
                    }
                } catch (err) {
                    showError("Network error occurred. Please try again.");
                    setLoading(false);
                }
            });
        })();
    </script>
</body>
</html>
